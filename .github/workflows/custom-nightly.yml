name: Custom nightly

on:
  schedule:
    # Upstream publishes an Orchestrator V2 preview at irregular times, and GitHub
    # drops many scheduled runs. Checking twice an hour, off the busy minute zero,
    # picks each preview up soon after it lands.
    - cron: "23,53 * * * *"
  push:
    branches: [custom-nightly]
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the latest upstream preview is already published
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  id-token: write

# A push supersedes whatever is building, including the run whose upstream
# merge push triggered it. Scheduled and manual runs queue instead, so a check
# for a new preview never restarts a build that is already on its way.
concurrency:
  group: custom-nightly
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    name: Merge upstream preview
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      commit: ${{ steps.prepare.outputs.commit }}
      upstream_tag: ${{ steps.prepare.outputs.upstream_tag }}
      version: ${{ steps.prepare.outputs.version }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_name: ${{ steps.prepare.outputs.release_name }}
      android_version_code: ${{ steps.prepare.outputs.android_version_code }}
    steps:
      # github.token can never push .github/workflows changes, which upstream merges often carry.
      - id: app-token
        name: Get a Chamaquita token
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=chamaquita" | jq -r .value
          )"
          token="$(
            curl -fsS -X POST -H "Authorization: Bearer $oidc_token" \
              https://chamaquita.d3labs.dev/github/actions/token | jq -r .token
          )"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Checkout customization branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - id: prepare
        name: Merge the latest released preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          set -euo pipefail

          git config user.name "t3code-custom-nightly[bot]"
          git config user.email "t3code-custom-nightly[bot]@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream --tags --force

          upstream_tag="$(
            gh api 'repos/pingdotgg/t3code/releases?per_page=30' \
              --jq '[.[] | select(.draft == false and .prerelease == true and (.tag_name | contains("-preview.")))][0].tag_name // ""'
          )"
          if [[ -z "$upstream_tag" ]]; then
            echo "No upstream preview release was found." >&2
            exit 1
          fi

          published_release_body="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
              --jq '[.[] | select(.draft == false and .prerelease == true and ((.body // "") | contains("<!-- upstream-release:")))][0].body // ""' \
          )"
          published_upstream_tag="$(sed -n 's/.*<!-- upstream-release: \([^ ]*\) -->.*/\1/p' <<< "$published_release_body")"
          published_custom_commit="$(sed -n 's/.*<!-- custom-commit: \([^ ]*\) -->.*/\1/p' <<< "$published_release_body")"
          current_commit="$(git rev-parse HEAD)"

          if [[ \
            "$FORCE_BUILD" != "true" \
            && "$published_upstream_tag" == "$upstream_tag" \
            && "$published_custom_commit" == "$current_commit" \
          ]]; then
            echo "Latest upstream preview and customization commit are already published."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One open issue per conflicting upstream preview, so a stalled build notifies the owner.
          conflict_title_suffix="conflicts with ${GITHUB_REF_NAME}"
          open_conflict_issues() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
              --jq ".[] | select(.title | endswith(\"${conflict_title_suffix}\")) | .number"
          }

          if ! git merge-base --is-ancestor "$upstream_tag" HEAD; then
            if ! git merge --no-edit "$upstream_tag"; then
              conflicted_files="$(git diff --name-only --diff-filter=U | sed 's/.*/- `&`/')"
              git merge --abort
              title="Upstream preview ${upstream_tag} ${conflict_title_suffix}"
              already_reported="$(
                gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title \
                  --jq "[.[] | select(.title == \"${title}\")] | length"
              )"
              if [[ "$already_reported" == "0" ]]; then
                for number in $(open_conflict_issues); do
                  gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Superseded by ${upstream_tag}."
                done
                # Chamaquita works issues labeled chamaquita and merges the pull request of one labeled automerge.
                gh label create chamaquita --repo "$GITHUB_REPOSITORY" --force --color 5319e7 \
                  --description "Chamaquita works this issue as a Job" ||
                  echo "::warning::Could not create the chamaquita label."
                gh label create automerge --repo "$GITHUB_REPOSITORY" --force --color 0e8a16 \
                  --description "Chamaquita merges the Job's pull request once its checks pass" ||
                  echo "::warning::Could not create the automerge label."
                job_branch="chamaquita/upstream-${upstream_tag}"
                issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(cat <<EOF
          @DiegoJohnsonL merging upstream preview [${upstream_tag}](https://github.com/pingdotgg/t3code/releases/tag/${upstream_tag}) into \`${GITHUB_REF_NAME}\` stopped on conflicts, so no custom build is published until they are resolved. Chamaquita resolves them and, because this issue carries \`automerge\`, merges its pull request once every check passes.

          Base branch: \`${GITHUB_REF_NAME}\`
          Job branch: \`${job_branch}\`
          Upstream tag: \`${upstream_tag}\` from https://github.com/pingdotgg/t3code.git

          Conflicted files:
          ${conflicted_files:-See the run log.}

          ## Task

          Do not run the repository's checks, builds, or test suites locally: GitHub CI runs them on the pull request. The one exception is the formatter: before committing the merge, run \`pnpm exec vp fmt <file>...\` on the files you resolved, because GitHub CI fails on unformatted files.

          1. Start \`${job_branch}\` from \`origin/${GITHUB_REF_NAME}\`, or continue it if an earlier attempt pushed it. Fetch the tag with \`git fetch --no-tags https://github.com/pingdotgg/t3code.git tag ${upstream_tag}\` and merge it with \`git merge --no-ff ${upstream_tag}\`. Never rebase, squash, or cherry-pick: the nightly decides what is new with \`git merge-base --is-ancestor ${upstream_tag} HEAD\`, so only a merge commit keeps the tag an ancestor.
          2. Resolve each conflicted hunk:
             - Classify it as disjoint (the sides changed different things, so keep both), same question with different answers (pick one side on the evidence), or superseded (one side's change makes the other's moot).
             - Touch only the conflicted regions, and leave every line git merged cleanly as it is.
             - Keep the fork's customizations and take upstream's changes. The fork's intent is in \`git log ${upstream_tag}..origin/${GITHUB_REF_NAME}\`; upstream's is in \`git log origin/${GITHUB_REF_NAME}..${upstream_tag}\` and its pull requests.
             - Regenerate lockfiles and generated files instead of merging them by hand: take upstream's \`pnpm-lock.yaml\` and run \`pnpm install\` to reconcile it with the merged manifests.
             - Leave no conflict markers: \`git grep -nE '^(<<<<<<<|>>>>>>>) '\` finds nothing.
          3. Commit the merge, push \`${job_branch}\`, and open a pull request into \`${GITHUB_REF_NAME}\`. Its body has a table with one row per conflicted hunk and the columns File:lines, Class, ${GITHUB_REF_NAME}, Upstream, Kept, and Why. If a push is refused for the workflows permission, change nothing and finish blocked with that reason.
          4. GitHub CI runs the fork's checks on the pull request. Chamaquita merges it as a merge commit once every check passes and GitHub finds it mergeable; if CI fails, Chamaquita hands the failures to the next attempt. The next run finds the tag merged, publishes the build, and closes this issue.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
                )")"
                gh issue edit "$issue_url" --repo "$GITHUB_REPOSITORY" --add-label chamaquita --add-label automerge ||
                  echo "::warning::Could not label ${issue_url} for Chamaquita."
              fi
              echo "Merging ${upstream_tag} conflicts with ${GITHUB_REF_NAME}." >&2
              exit 1
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          for number in $(open_conflict_issues); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Merged in $(git rev-parse --short HEAD)."
          done

          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          stable_version="${package_version%%-*}"
          IFS=. read -r major minor patch <<< "$stable_version"
          target_patch="$((patch + 1))"
          release_date="$(date -u +%Y%m%d)"
          release_run="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          version="${major}.${minor}.${target_patch}-nightly.${release_date}.${release_run}"
          commit="$(git rev-parse HEAD)"

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_name=D3 Code $version" >> "$GITHUB_OUTPUT"
          # Minutes since the epoch keep Android version codes increasing across runs and reruns.
          echo "android_version_code=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS arm64
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_COMMIT"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: |
          rustup target add aarch64-apple-darwin
          vp install \
            --filter=t3... \
            --filter=@t3tools/web... \
            --filter=@t3tools/desktop... \
            --filter=@t3tools/scripts...

      - name: Load public T3 Connect configuration
        shell: bash
        run: |
          sed -n '/^T3CODE_CLERK_PUBLISHABLE_KEY=/p; /^T3CODE_CLERK_JWT_TEMPLATE=/p; /^T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=/p; /^T3CODE_RELAY_URL=/p' .env.example >> "$GITHUB_ENV"

      - name: Trust custom signing certificate
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CUSTOM_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CUSTOM_MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "Custom macOS signing secrets are missing." >&2
            exit 1
          fi
          identity_path="$RUNNER_TEMP/custom-signing-identity.p12"
          certificate_path="$RUNNER_TEMP/custom-signing-certificate.pem"
          printf '%s' "$CSC_LINK" | /usr/bin/base64 -D > "$identity_path"
          /usr/bin/openssl pkcs12 \
            -in "$identity_path" \
            -passin "pass:$CSC_KEY_PASSWORD" \
            -nokeys \
            -clcerts \
            -out "$certificate_path"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$certificate_path"
          security verify-cert -c "$certificate_path" -p codeSign

      - name: Build signed desktop artifacts
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CUSTOM_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CUSTOM_MACOS_CSC_KEY_PASSWORD }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_MACOS_PASSKEY_SIGNING: "false"
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "Custom macOS signing secrets are missing." >&2
            exit 1
          fi
          node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"
          env \
            -u GH_TOKEN \
            -u GITHUB_TOKEN \
            vp run dist:desktop:dmg:arm64 \
              --build-version "${{ needs.prepare.outputs.version }}" \
              --signed \
              --verbose

      - name: Validate update assets and write checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release/*-arm64.zip)
          manifests=(release/nightly-mac.yml)
          blockmaps=(release/*-arm64.zip.blockmap)
          if [[ ${#archives[@]} -ne 1 ]]; then
            printf 'Expected one arm64 zip, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi
          if [[ ${#manifests[@]} -ne 1 ]]; then
            printf 'Expected one nightly macOS update manifest, found %s\n' "${#manifests[@]}" >&2
            exit 1
          fi
          if [[ ${#blockmaps[@]} -ne 1 ]]; then
            printf 'Expected one arm64 zip blockmap, found %s\n' "${#blockmaps[@]}" >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          cd release
          shasum -a 256 "$archive_name" > "$archive_name.sha256"

          verification_dir="$RUNNER_TEMP/signed-update"
          mkdir -p "$verification_dir"
          ditto -x -k "$archive_name" "$verification_dir"
          app_bundle="$(find "$verification_dir" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "The signed update archive contains no application bundle." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign -d --verbose=4 "$app_bundle" 2>&1 \
            | grep -F 'Authority=T3 Code Local Development'
          update_config="$app_bundle/Contents/Resources/app-update.yml"
          grep -F "owner: ${GITHUB_REPOSITORY_OWNER}" "$update_config"
          grep -F "repo: ${GITHUB_REPOSITORY#*/}" "$update_config"

      - name: Publish custom nightly
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'EOF'
          Automated custom build of T3 Code for macOS arm64, Windows x64, Linux x64, and Android.

          Upstream release: `${{ needs.prepare.outputs.upstream_tag }}`

          <!-- upstream-release: ${{ needs.prepare.outputs.upstream_tag }} -->
          <!-- custom-commit: ${{ needs.prepare.outputs.commit }} -->
          EOF

          gh release create "${{ needs.prepare.outputs.release_tag }}" \
            release/*.dmg \
            release/*.zip \
            release/*.blockmap \
            release/nightly-mac.yml \
            release/*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.prepare.outputs.commit }}" \
            --title "${{ needs.prepare.outputs.release_name }}" \
            --notes-file "$notes_file" \
            --prerelease \
            --draft
          gh release edit "${{ needs.prepare.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  # Windows and Linux reuse upstream's per-platform packaging workflow, so the
  # fork ships the same payload upstream does. It packages a prebuilt JS bundle.
  bundle:
    name: Build JS bundle
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      clerk_publishable_key: ${{ steps.connect.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.connect.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.connect.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.connect.outputs.relay_url }}
    steps:
      - name: Checkout release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_COMMIT"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Load public T3 Connect configuration
        id: connect
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" .env.example; }
          {
            echo "T3CODE_CLERK_PUBLISHABLE_KEY=$(value T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "T3CODE_CLERK_JWT_TEMPLATE=$(value T3CODE_CLERK_JWT_TEMPLATE)"
            echo "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=$(value T3CODE_CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "T3CODE_RELAY_URL=$(value T3CODE_RELAY_URL)"
          } >> "$GITHUB_ENV"
          {
            echo "clerk_publishable_key=$(value T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(value T3CODE_CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(value T3CODE_CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(value T3CODE_RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      # @t3tools/desktop#build compiles the Linux browser secret helper, which
      # needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Also builds the Linux CLI archive the Windows installer embeds for WSL.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Linux x64
      runner: ubuntu-latest
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.commit }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  # Unsigned: Windows shows a SmartScreen prompt on first install.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [prepare, bundle, desktop_linux_x64]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Windows x64
      runner: windows-latest
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.commit }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  publish-desktop:
    name: Attach Windows and Linux builds
    needs: [prepare, build, desktop_linux_x64, desktop_win_x64]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Download desktop builds
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-x64
          path: release
          merge-multiple: true

      # upstream's workflow suffixes the Windows feed by arch for its two-arch
      # merge; with x64 alone it is the channel's feed as is.
      - name: Attach to the custom nightly
        shell: bash
        run: |
          set -euo pipefail
          shopt -s extglob nullglob
          mv release/nightly-win-x64.yml release/nightly.yml
          gh release upload "$RELEASE_TAG" \
            release/*.exe \
            release/*.AppImage \
            release/*.blockmap \
            release/!(builder-debug).yml \
            --repo "$GITHUB_REPOSITORY"

  android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_PATH: release/T3-Code-${{ needs.prepare.outputs.version }}-android-arm64.apk
    steps:
      - name: Checkout release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_COMMIT"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build signed APK
        shell: bash
        env:
          CUSTOM_ANDROID_KEYSTORE: ${{ secrets.CUSTOM_ANDROID_KEYSTORE }}
          T3CODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CUSTOM_ANDROID_KEYSTORE_PASSWORD }}
          T3CODE_ANDROID_UPDATE_RELEASES_URL: https://api.github.com/repos/${{ github.repository }}/releases
        run: |
          set -euo pipefail
          if [[ -z "$CUSTOM_ANDROID_KEYSTORE" || -z "$T3CODE_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "Custom Android signing secrets are missing." >&2
            exit 1
          fi
          export T3CODE_ANDROID_KEYSTORE="$RUNNER_TEMP/custom-android-signing.p12"
          printf '%s' "$CUSTOM_ANDROID_KEYSTORE" | base64 -d > "$T3CODE_ANDROID_KEYSTORE"
          mkdir -p release
          scripts/build-custom-android-apk.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.android_version_code }}" \
            "$APK_PATH"

      - name: Validate APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt2" dump badging "$APK_PATH" \
            | grep -F "package: name='com.t3tools.t3code.preview' versionCode='${{ needs.prepare.outputs.android_version_code }}'"
          "$build_tools/apksigner" verify --print-certs "$APK_PATH" \
            | grep -F 'certificate SHA-256 digest: c4dec69aca9c6c1da72b2bf83d506222359bf69067ca34dec29c88603ab0df20'

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

  publish-android:
    name: Attach Android APK
    needs: [prepare, build, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release

      - name: Attach APK to the custom nightly
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release/*.apk --repo "$GITHUB_REPOSITORY"
          # The app only offers releases that carry this marker next to an uploaded APK.
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes_file"
          printf '\n<!-- android-version-code: %s -->\n' "${{ needs.prepare.outputs.android_version_code }}" >> "$notes_file"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
