name: Custom nightly

on:
  schedule:
    # Upstream publishes main-branch nightlies at irregular times, and GitHub
    # drops many scheduled runs. Checking twice an hour, off the busy minute zero,
    # picks each nightly up soon after it lands.
    - cron: "23,53 * * * *"
  push:
    branches: [custom-nightly]
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the latest upstream nightly is already published
        required: false
        default: false
        type: boolean

permissions:
  # release-desktop.yml asks for actions: read, and a reusable workflow can
  # never hold more than its caller grants.
  actions: read
  contents: write
  issues: write
  id-token: write
  pull-requests: write

# A push supersedes whatever is building, including the run whose upstream
# merge push triggered it. Scheduled and manual runs queue instead, so a check
# for a new nightly never restarts a build that is already on its way.
concurrency:
  group: custom-nightly
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    name: Merge upstream nightly
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      commit: ${{ steps.prepare.outputs.commit }}
      upstream_tag: ${{ steps.prepare.outputs.upstream_tag }}
      upstream_changes: ${{ steps.prepare.outputs.upstream_changes }}
      version: ${{ steps.prepare.outputs.version }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_name: ${{ steps.prepare.outputs.release_name }}
      android_version_code: ${{ steps.prepare.outputs.android_version_code }}
    steps:
      # github.token can never push .github/workflows changes, which upstream merges often carry.
      - id: app-token
        name: Get a Chamaquita token
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=chamaquita" | jq -r .value
          )"
          token="$(
            curl -fsS -X POST -H "Authorization: Bearer $oidc_token" \
              https://chamaquita.d3labs.dev/github/actions/token | jq -r .token
          )"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Checkout customization branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - id: prepare
        name: Merge the latest released nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          set -euo pipefail

          git config user.name "t3code-custom-nightly[bot]"
          git config user.email "t3code-custom-nightly[bot]@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

          upstream_tag="$(
            gh api 'repos/pingdotgg/t3code/releases?per_page=30' \
              --jq '[.[] | select(.draft == false and .prerelease == true and (.tag_name | contains("-nightly.")))][0].tag_name // ""'
          )"
          if [[ -z "$upstream_tag" ]]; then
            echo "No upstream nightly release was found." >&2
            exit 1
          fi
          git fetch --no-tags upstream tag "$upstream_tag"
          git merge-base --is-ancestor "$upstream_tag" upstream/main

          published_release_body="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
              --jq '[.[] | select(.draft == false and .prerelease == true and ((.body // "") | contains("<!-- upstream-release:")))][0].body // ""' \
          )"
          published_upstream_tag="$(sed -n 's/.*<!-- upstream-release: \([^ ]*\) -->.*/\1/p' <<< "$published_release_body")"
          published_custom_commit="$(sed -n 's/.*<!-- custom-commit: \([^ ]*\) -->.*/\1/p' <<< "$published_release_body")"
          current_commit="$(git rev-parse HEAD)"

          if [[ \
            "$FORCE_BUILD" != "true" \
            && "$published_upstream_tag" == "$upstream_tag" \
            && "$published_custom_commit" == "$current_commit" \
          ]]; then
            echo "Latest upstream nightly and customization commit are already published."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source .github/scripts/custom-nightly-jobs.sh

          if ! git merge-base --is-ancestor "$upstream_tag" HEAD; then
            if ! git merge --no-edit "$upstream_tag"; then
              conflicted_files="$(git diff --name-only --diff-filter=U | sed 's/.*/- `&`/')"
              git merge --abort
              file_job_issue "$upstream_tag" "$(printf 'Merging it stopped on conflicts in:\n\n%s' "${conflicted_files:-See the run log.}")"
              echo "Merging ${upstream_tag} conflicts with ${GITHUB_REF_NAME}." >&2
              exit 1
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          close_job_work "$upstream_tag" "Superseded: ${GITHUB_REF_NAME} already includes ${upstream_tag} as of $(git rev-parse --short HEAD)."

          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          stable_version="${package_version%%-*}"
          IFS=. read -r major minor patch <<< "$stable_version"
          target_patch="$((patch + 1))"
          release_date="$(date -u +%Y%m%d)"
          release_run="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          version="${major}.${minor}.${target_patch}-nightly.${release_date}.${release_run}"
          commit="$(git rev-parse HEAD)"

          upstream_changes=""
          if [[ -n "$published_upstream_tag" && "$published_upstream_tag" != "$upstream_tag" ]]; then
            git fetch --no-tags upstream tag "$published_upstream_tag"
            upstream_changes="$(git log --reverse --first-parent --format='- %s' "${published_upstream_tag}..${upstream_tag}")"
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          {
            echo "upstream_changes<<UPSTREAM_CHANGES_EOF"
            echo "$upstream_changes"
            echo "UPSTREAM_CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_name=D3 Code $version" >> "$GITHUB_OUTPUT"
          # Minutes since the epoch keep Android version codes increasing across runs and reruns.
          echo "android_version_code=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS arm64
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_COMMIT"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: |
          rustup target add aarch64-apple-darwin
          vp install \
            --filter=t3... \
            --filter=@t3tools/web... \
            --filter=@t3tools/desktop... \
            --filter=@t3tools/scripts...

      - name: Load public T3 Connect configuration
        shell: bash
        run: |
          sed -n '/^T3CODE_CLERK_PUBLISHABLE_KEY=/p; /^T3CODE_CLERK_JWT_TEMPLATE=/p; /^T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=/p; /^T3CODE_RELAY_URL=/p' .env.example >> "$GITHUB_ENV"

      - name: Trust custom signing certificate
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CUSTOM_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CUSTOM_MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "Custom macOS signing secrets are missing." >&2
            exit 1
          fi
          identity_path="$RUNNER_TEMP/custom-signing-identity.p12"
          certificate_path="$RUNNER_TEMP/custom-signing-certificate.pem"
          printf '%s' "$CSC_LINK" | /usr/bin/base64 -D > "$identity_path"
          /usr/bin/openssl pkcs12 \
            -in "$identity_path" \
            -passin "pass:$CSC_KEY_PASSWORD" \
            -nokeys \
            -clcerts \
            -out "$certificate_path"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$certificate_path"
          security verify-cert -c "$certificate_path" -p codeSign

      - name: Build signed desktop artifacts
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CUSTOM_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CUSTOM_MACOS_CSC_KEY_PASSWORD }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_MACOS_PASSKEY_SIGNING: "false"
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "Custom macOS signing secrets are missing." >&2
            exit 1
          fi
          node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"
          env \
            -u GH_TOKEN \
            -u GITHUB_TOKEN \
            vp run dist:desktop:dmg:arm64 \
              --build-version "${{ needs.prepare.outputs.version }}" \
              --signed \
              --verbose

      - name: Validate update assets and write checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release/*-arm64.zip)
          manifests=(release/nightly-mac.yml)
          blockmaps=(release/*-arm64.zip.blockmap)
          if [[ ${#archives[@]} -ne 1 ]]; then
            printf 'Expected one arm64 zip, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi
          if [[ ${#manifests[@]} -ne 1 ]]; then
            printf 'Expected one nightly macOS update manifest, found %s\n' "${#manifests[@]}" >&2
            exit 1
          fi
          if [[ ${#blockmaps[@]} -ne 1 ]]; then
            printf 'Expected one arm64 zip blockmap, found %s\n' "${#blockmaps[@]}" >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          cd release
          shasum -a 256 "$archive_name" > "$archive_name.sha256"

          verification_dir="$RUNNER_TEMP/signed-update"
          mkdir -p "$verification_dir"
          ditto -x -k "$archive_name" "$verification_dir"
          app_bundle="$(find "$verification_dir" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "The signed update archive contains no application bundle." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign -d --verbose=4 "$app_bundle" 2>&1 \
            | grep -F 'Authority=T3 Code Local Development'
          update_config="$app_bundle/Contents/Resources/app-update.yml"
          grep -F "owner: ${GITHUB_REPOSITORY_OWNER}" "$update_config"
          grep -F "repo: ${GITHUB_REPOSITORY#*/}" "$update_config"

      - name: Publish custom nightly
        shell: bash
        env:
          UPSTREAM_CHANGES: ${{ needs.prepare.outputs.upstream_changes }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'EOF'
          Automated custom build of T3 Code for macOS arm64, Windows x64, Linux x64, and Android.

          Upstream release: `${{ needs.prepare.outputs.upstream_tag }}`

          <!-- upstream-release: ${{ needs.prepare.outputs.upstream_tag }} -->
          <!-- custom-commit: ${{ needs.prepare.outputs.commit }} -->
          EOF
          # The update popover shows a release's last eight list items, so upstream's changes go last.
          if [[ -n "$UPSTREAM_CHANGES" ]]; then
            printf '\n## Upstream changes\n\n%s\n' "$UPSTREAM_CHANGES" >> "$notes_file"
          fi

          gh release create "${{ needs.prepare.outputs.release_tag }}" \
            release/*.dmg \
            release/*.zip \
            release/*.blockmap \
            release/nightly-mac.yml \
            release/*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.prepare.outputs.commit }}" \
            --title "${{ needs.prepare.outputs.release_name }}" \
            --notes-file "$notes_file" \
            --prerelease \
            --draft
          gh release edit "${{ needs.prepare.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          source .github/scripts/custom-nightly-jobs.sh
          close_job_work "" "Published in ${{ needs.prepare.outputs.release_tag }}."

  # A build that fails on the merged commit files the same Job issue a merge
  # conflict does. Upstream's Windows and Linux packaging are left out: they
  # ship upstream's payload unchanged.
  report-build-failure:
    name: Report build failure
    needs: [prepare, build, bundle, android]
    if: always() && needs.prepare.outputs.should_build == 'true' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: File the Job issue
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          failure="$(printf 'The build of `%s` failed:\n' "$RELEASE_COMMIT")"
          while IFS=$'\t' read -r job_id job_name step_name; do
            log_tail="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" 2>/dev/null \
                | sed -E 's/^[0-9TZ:.-]+ //' \
                | tail -n 60 \
                | tail -c 6000
            )" || log_tail="Could not read the log."
            failure+="$(printf '\n### %s, step "%s"\n\n```text\n%s\n```\n' "$job_name" "$step_name" "$log_tail")"
          done < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name, ([.steps[] | select(.conclusion == "failure") | .name][0] // "unknown")] | @tsv'
          )
          source .github/scripts/custom-nightly-jobs.sh
          file_job_issue "$UPSTREAM_TAG" "$failure"

  # Windows and Linux reuse upstream's per-platform packaging workflow, so the
  # fork ships the same payload upstream does. It packages a prebuilt JS bundle.
  bundle:
    name: Build JS bundle
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      clerk_publishable_key: ${{ steps.connect.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.connect.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.connect.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.connect.outputs.relay_url }}
    steps:
      - name: Checkout release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_COMMIT"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Load public T3 Connect configuration
        id: connect
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" .env.example; }
          {
            echo "T3CODE_CLERK_PUBLISHABLE_KEY=$(value T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "T3CODE_CLERK_JWT_TEMPLATE=$(value T3CODE_CLERK_JWT_TEMPLATE)"
            echo "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=$(value T3CODE_CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "T3CODE_RELAY_URL=$(value T3CODE_RELAY_URL)"
          } >> "$GITHUB_ENV"
          {
            echo "clerk_publishable_key=$(value T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(value T3CODE_CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(value T3CODE_CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(value T3CODE_RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      # @t3tools/desktop#build compiles the Linux browser secret helper, which
      # needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Also builds the Linux CLI archive the Windows installer embeds for WSL.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Linux x64
      runner: ubuntu-latest
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.commit }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  # Unsigned: Windows shows a SmartScreen prompt on first install.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [prepare, bundle, desktop_linux_x64]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Windows x64
      runner: windows-latest
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.commit }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  publish-desktop:
    name: Attach Windows and Linux builds
    needs: [prepare, build, desktop_linux_x64, desktop_win_x64]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Download desktop builds
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-x64
          path: release
          merge-multiple: true

      # `t3 service install`, `t3 update` and SSH remotes download the CLI
      # archive for their exact version and verify it against SHA256SUMS.
      - name: Download CLI archive
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: release

      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # upstream's workflow suffixes the Windows feed by arch for its two-arch
      # merge; with x64 alone it is the channel's feed as is.
      - name: Attach to the custom nightly
        shell: bash
        run: |
          set -euo pipefail
          shopt -s extglob nullglob
          mv release/nightly-win-x64.yml release/nightly.yml
          gh release upload "$RELEASE_TAG" \
            release/*.exe \
            release/*.AppImage \
            release/*.blockmap \
            release/!(builder-debug).yml \
            release/t3-*.tar.gz \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"

  android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      runtime_version: ${{ steps.ota.outputs.runtime_version }}
    env:
      APK_PATH: release/T3-Code-${{ needs.prepare.outputs.version }}-android-arm64.apk
      T3CODE_ANDROID_UPDATE_RELEASES_URL: https://api.github.com/repos/${{ github.repository }}/releases
      # Server push and over-the-air updates stay off until these are set; see docs/operations/custom-nightly.md.
      T3CODE_EXPO_PROJECT_ID: ${{ vars.T3CODE_EXPO_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_COMMIT"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build signed APK
        shell: bash
        env:
          CUSTOM_ANDROID_KEYSTORE: ${{ secrets.CUSTOM_ANDROID_KEYSTORE }}
          T3CODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CUSTOM_ANDROID_KEYSTORE_PASSWORD }}
          CUSTOM_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.CUSTOM_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$CUSTOM_ANDROID_KEYSTORE" || -z "$T3CODE_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "Custom Android signing secrets are missing." >&2
            exit 1
          fi
          export T3CODE_ANDROID_KEYSTORE="$RUNNER_TEMP/custom-android-signing.p12"
          printf '%s' "$CUSTOM_ANDROID_KEYSTORE" | base64 -d > "$T3CODE_ANDROID_KEYSTORE"
          if [[ -n "$CUSTOM_ANDROID_GOOGLE_SERVICES_JSON" ]]; then
            export T3CODE_ANDROID_GOOGLE_SERVICES_FILE="$RUNNER_TEMP/google-services.json"
            printf '%s' "$CUSTOM_ANDROID_GOOGLE_SERVICES_JSON" > "$T3CODE_ANDROID_GOOGLE_SERVICES_FILE"
            # The update publish must read the same app config as this build.
            echo "T3CODE_ANDROID_GOOGLE_SERVICES_FILE=$T3CODE_ANDROID_GOOGLE_SERVICES_FILE" >> "$GITHUB_ENV"
          fi
          mkdir -p release
          scripts/build-custom-android-apk.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.android_version_code }}" \
            "$APK_PATH"

      - name: Validate APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt2" dump badging "$APK_PATH" \
            | grep -F "package: name='com.t3tools.t3code.preview' versionCode='${{ needs.prepare.outputs.android_version_code }}'"
          "$build_tools/apksigner" verify --print-certs "$APK_PATH" \
            | grep -F 'certificate SHA-256 digest: c4dec69aca9c6c1da72b2bf83d506222359bf69067ca34dec29c88603ab0df20'

      - name: Setup EAS
        if: env.EXPO_TOKEN != '' && env.T3CODE_EXPO_PROJECT_ID != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      # A failed publish still ships the APK; the release then lacks the
      # runtime marker, so phones are offered the APK instead.
      - name: Publish over-the-air update
        id: ota
        if: env.EXPO_TOKEN != '' && env.T3CODE_EXPO_PROJECT_ID != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(
            scripts/publish-custom-android-update.sh \
              "${{ needs.prepare.outputs.version }}" \
              "${{ needs.prepare.outputs.android_version_code }}" \
              "$APK_PATH" \
              "${{ needs.prepare.outputs.release_name }}"
          )"
          echo "runtime_version=$runtime_version" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

  publish-android:
    name: Attach Android APK
    needs: [prepare, build, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RUNTIME_VERSION: ${{ needs.android.outputs.runtime_version }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release

      - name: Attach APK to the custom nightly
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release/*.apk --repo "$GITHUB_REPOSITORY"
          # The app only offers releases that carry this marker next to an uploaded APK.
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes_file"
          printf '\n<!-- android-version-code: %s -->\n' "${{ needs.prepare.outputs.android_version_code }}" >> "$notes_file"
          # Phones on this runtime take the release over the air, so the app skips its APK.
          if [[ -n "$RUNTIME_VERSION" ]]; then
            printf '<!-- android-runtime-version: %s -->\n' "$RUNTIME_VERSION" >> "$notes_file"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
